<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>ForceCar OG template (1200×630)</title>
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0d10;
        color: #f5f5f5;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 72px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Barlow Condensed', sans-serif;
        text-transform: uppercase;
      }
      .card img {
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: 760px;
        object-fit: cover;
        object-position: 85% 50%;
        z-index: 0;
      }
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #0b0d10 32%, rgb(11 13 16 / 0.7) 50%, rgb(11 13 16 / 0) 75%);
      }
      .card > :not(img) {
        position: relative;
        z-index: 1;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.32em;
        color: #a3a7ad;
      }
      .eyebrow::before {
        content: '';
        width: 48px;
        height: 2px;
        background: #ff5a24;
      }
      h1 {
        margin: 0;
        font-weight: 700;
        font-size: 150px;
        line-height: 0.86;
      }
      h1 span {
        color: #ff5a24;
      }
      .meta {
        display: flex;
        gap: 40px;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.06em;
      }
      .meta b {
        color: #ff5a24;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/img/hero-poster-desktop-1920.jpg" alt="" />
      <p class="eyebrow">ForceCar — Chișinău</p>
      <h1>Vulcanizare<br />Non-stop<span>.</span></h1>
      <p class="meta"><b>24/7</b><span>+373 79 535 005</span><span>str. Ismail 103</span></p>
    </div>
  </body>
</html>
